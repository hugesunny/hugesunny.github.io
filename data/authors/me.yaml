bio: |
  Seung Hyun Kim is a Postdoctoral Research Associate in the Department of Chemistry
  at the University of North Carolina at Chapel Hill, working under the guidance of
  Prof. Wei You. He earned his Ph.D. in Chemical Engineering at Pohang University of
  Science and Technology (POSTECH) under the supervision of Prof. Kilwon Cho.

  His research focuses on conjugated polymers and organic semiconductors, with
  particular emphasis on structure-property relationships, charge transport,
  mechanical deformation, molecular and interface engineering, organic
  photodetectors, and organic electrochemical transistors.

