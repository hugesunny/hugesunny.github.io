home_intro: >-
  I study conjugated polymers and organic semiconductors, with an emphasis on
  structure-property relationships, charge transport, mechanical deformation,
  molecular and interface engineering, organic photodetectors, and organic
  electrochemical transistors. At UNC, I work with [Prof. Wei You](https://weiyougroup.org/).
  I earned my PhD in Chemical Engineering at POSTECH under the supervision of
  [Prof. Kilwon Cho](http://crg.postech.ac.kr/).
