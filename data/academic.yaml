home_intro: >-
  Seung Hyun Kim studies how molecular structure, thin-film morphology, and interfaces govern
  charge transport in conjugated polymers and organic semiconductors. His work
  spans mechanically deformable electronics, organic photodetectors, and organic
  electrochemical transistors.
home_background: >-
  I currently work with [Prof. Wei You](https://weiyougroup.org/) at UNC Chapel Hill
  and earned my PhD in Chemical Engineering at POSTECH under
  [Prof. Kilwon Cho](http://crg.postech.ac.kr/).
featured_publication: /publications/kim-2024-multiscale/
featured_overview: >-
  This study examines how polymer backbone rigidity affects deformation and
  charge transport under strain. Comparing DPP-4T and DPP-DTT connects molecular
  structure with their different responses to stretching.
research_intro: My research focuses on understanding and controlling the relationships among molecular structure, thin-film morphology, interfaces, and charge transport in conjugated polymers for emerging organic electronic devices.
