<script>
document.addEventListener('DOMContentLoaded', function () {
  var root = document.documentElement;
  var button = document.querySelector('[data-academic-theme-toggle]');
  if (!button) return;

  function isDark() {
    return root.classList.contains('academic-dark');
  }

  function syncButton() {
    var dark = isDark();
    button.setAttribute('aria-pressed', dark ? 'true' : 'false');
    button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    button.setAttribute('title', dark ? 'Light mode' : 'Dark mode');
  }

  function applyTheme(theme) {
    var dark = theme === 'dark';
    root.classList.toggle('academic-dark', dark);
    root.classList.toggle('dark', dark);
    root.style.colorScheme = dark ? 'dark' : 'light';
    try { localStorage.setItem('academic-theme', theme); } catch (e) {}
    syncButton();
  }

  syncButton();
  button.addEventListener('click', function () {
    applyTheme(isDark() ? 'light' : 'dark');
  });
});
</script>
