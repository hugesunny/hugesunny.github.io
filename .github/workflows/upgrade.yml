name: Upgrade Site Dependencies

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Upgrade to version'
        required: true
        default: 'Stable'
        type: choice
        options:
          - Stable
          - Beta (Preview)
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_path: ./package.json
          run_install: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Run dependency upgrade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TYPE: ${{ inputs.version_type || 'Stable' }}
        run: |
          FLAGS="--yes --ci"
          if [ "$VERSION_TYPE" == "Beta (Preview)" ]; then
            FLAGS="$FLAGS --canary"
          fi
          pnpm dlx hugoblox@latest upgrade $FLAGS

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): upgrade site dependencies'
          title: 'Upgrade site dependencies'
          body: |
            Automated dependency update.

            Please verify the site build and visual appearance before merging.
          branch: "chore/upgrade-site-${{ github.run_id }}"
          delete-branch: true
          base: main
          labels: |
            dependencies
            automated-pr
