name: Import Publications From BibTeX

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: ['main']
    paths: ['publications.bib']
  workflow_dispatch:

concurrency:
  group: import-publications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ACADEMIC_VERSION: '>=0.10.0'
      PYTHON_VERSION: '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup pip cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-academic-${{ env.ACADEMIC_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-academic-
            ${{ runner.os }}-pip-

      - name: Install publication importer
        run: |
          python -m pip install --upgrade pip
          pip install "academic${{ env.ACADEMIC_VERSION }}"

      - name: Validate publications.bib
        if: ${{ hashFiles('publications.bib') != '' }}
        run: |
          if [ ! -f "publications.bib" ]; then
            echo "publications.bib file not found"
            exit 1
          fi
          echo "publications.bib file found"

      - name: Import BibTeX publications
        if: ${{ hashFiles('publications.bib') != '' }}
        run: |
          academic import publications.bib content/publications/ --compact --verbose
          if [ -d "content/publications" ] && [ "$(ls -A content/publications/)" ]; then
            echo "Imported $(ls content/publications/ | wc -l) publication entries"
          else
            echo "No publications were imported"
          fi

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'feat(publications): import latest publications from BibTeX'
          title: 'Update publications from BibTeX'
          body: |
            Automated update of publication pages from the repository's `publications.bib` file.

            Please review the generated metadata and citation files before merging.
          base: main
          labels: automated-pr, content, publications
          branch: import-publications-${{ github.run_id }}
          delete-branch: true
          draft: false

      - name: Report pull request
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request #${{ steps.cpr.outputs.pull-request-number }}"
          echo "${{ steps.cpr.outputs.pull-request-url }}"
